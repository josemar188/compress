<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compressor de Vídeo Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Compressor de Vídeo</h1>
        <p>Arraste um vídeo ou clique para selecionar. Tudo é processado no seu navegador.</p>
        
        <div id="drop-area" class="drop-area">
            <p>Arraste e solte o vídeo aqui ou <span class="browse">clique para escolher</span></p>
            <input type="file" id="file-input" accept="video/*" hidden>
        </div>

        <div id="file-info" class="hidden">
            <p><strong>Arquivo:</strong> <span id="file-name"></span></p>
            <p><strong>Tamanho original:</strong> <span id="file-size"></span></p>
        </div>

        <div id="options" class="hidden">
            <label for="quality">Qualidade da compressão:</label>
            <select id="quality">
                <option value="23">Alta (CRF 23) - Melhor qualidade</option>
                <option value="28" selected>Média (CRF 28) - Recomendado</option>
                <option value="32">Baixa (CRF 32) - Menor tamanho</option>
            </select>
            <p id="estimate" class="estimate"></p>
            <button id="compress-btn" disabled>Comprimir Vídeo</button>
        </div>

        <div id="progress-container" class="hidden">
            <p id="status"></p>
            <progress id="progress-bar" value="0" max="100"></progress>
        </div>

        <div id="download-area" class="hidden">
            <p>✅ Compressão concluída!</p>
            <a id="download-link" class="download-btn" download>Baixar Vídeo Comprimido</a>
        </div>
    </div>

    <script src="script.js" type="module"></script>
</body>
</html>
